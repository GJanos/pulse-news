name: Notify

# Scheduled Actions caveats:
# - GitHub fires `schedule` best-effort; delays of 5–15+ minutes (or whole
#   skipped slots) are normal. The job notifies devices whose notify_at fell in
#   (last_run_at, now], so a skipped slot is caught up on the next run instead of
#   dropping those devices. last_run_at lives in the notify_state table and only
#   advances when the job actually runs.
# - GitHub disables schedules after 60 days without repo activity.
# - Cost (private repo): each job bills a minimum of 1 minute, so 48 runs/day
#   is a ~1,440 min/month floor against the 2,000 free minutes. The guard step
#   below keeps empty-window runs at that floor instead of ~2–3 min of
#   checkout + npm ci. If the floor itself becomes a problem, the options are:
#   make the repo public, narrow the schedule to waking hours, or move notify
#   to a Supabase scheduled Edge Function.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Most runs have no due devices. Ask Supabase first (no checkout/install
      # needed) via the peek RPC and skip the heavy steps when nothing is due.
      # The RPC encapsulates the (last_run_at, now] selection rule shared with
      # the job. Fails OPEN: any guard error runs the job.
      - name: Check for due devices
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node -e '
            const url = `${process.env.SUPABASE_URL}/rest/v1/rpc/peek_due_notifications`;
            fetch(url, {
              method: "POST",
              headers: {
                apikey: process.env.SUPABASE_SECRET_KEY,
                Authorization: `Bearer ${process.env.SUPABASE_SECRET_KEY}`,
                "Content-Type": "application/json",
              },
              body: "{}",
            })
              .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`))))
              .then((due) => {
                console.log(`due: ${due}`);
                process.stdout.write(`has=${due === true}\n`);
              })
              .catch((e) => {
                console.log(`guard error (${e.message}) — failing open`);
                process.stdout.write("has=true\n");
              });
          ' | tee guard.out
          grep "^has=" guard.out >> "$GITHUB_OUTPUT" || echo "has=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.has == 'true'

      - uses: ./.github/actions/run-cron-job
        if: steps.guard.outputs.has == 'true'
        with:
          job: jobs/notify.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
